name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # T-149: main'ga push'da kod PR'da aynan shu holatda tekshirilgan bo'lsa lint/test/e2e takrorlanmaydi
  verified:
    name: PR'da tekshirilganmi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.find.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/ci-verified.sh >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, test, build
    needs: [verified]
    if: ${{ !cancelled() && needs.verified.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: samarqand, POSTGRES_PASSWORD: samarqand, POSTGRES_DB: samarqand }
        ports: ["5435:5432"]
        options: --health-cmd "pg_isready -U samarqand" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://samarqand:samarqand@localhost:5435/samarqand
      BOT_TOKEN: "000000:CI_ONLY"
      JWT_SECRET: ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Migrate
        run: pnpm --filter @samarqand/db run deploy
      - name: Prisma drift (sxema va migratsiyalar mos)
        run: |
          cd packages/db
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  e2e:
    name: Browser (Playwright)
    needs: [verified]
    if: ${{ !cancelled() && needs.verified.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: samarqand, POSTGRES_PASSWORD: samarqand, POSTGRES_DB: samarqand }
        ports: ["5435:5432"]
        options: --health-cmd "pg_isready -U samarqand" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://samarqand:samarqand@localhost:5435/samarqand
      BOT_TOKEN: "000000:CI_ONLY"
      JWT_SECRET: ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @samarqand/db run deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

  deploy:
    name: Deploy (production)
    needs: [verified, check, e2e]
    # PR'da tekshirilgan (skip) yoki shu yerda check va e2e o'tgan bo'lsa
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      ((needs.verified.result == 'success' && needs.verified.outputs.skip == 'true') ||
      (needs.check.result == 'success' && needs.e2e.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Kalit serverda faqat scripts/deploy.sh ni ishga tushira oladi (authorized_keys command=)
      - name: SSH deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes ubuntu@"$HOST"
